function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));document.getElementById('title').innerHTML='<span id="userFirstName">'+(JSON.parse(localStorage.getItem('rubiSession')||'{"name":"Atleta"}').name.split(/\s+/)[0])+'</span> 👋';document.getElementById('subtitle').textContent=copy[id][1];scrollTo({top:0,behavior:'smooth'})}

async function signOut(){await supabaseClient.auth.signOut();document.getElementById('authScreen').classList.add('show');setAuthMode('login');toast('Sesión cerrada. ¡Hasta tu próximo entreno!')}
async function recoverPassword(){const email=document.getElementById('authEmail').value.trim();const error=document.getElementById('authError');if(!email){error.textContent='Introduce tu email y te enviaremos el enlace de recuperación.';return}error.textContent='Enviando enlace de recuperación…';const {error:err}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});error.textContent=err?err.message:'Si el email está registrado, recibirás un enlace para restablecer tu contraseña.'}
document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('authEmail').value.trim().toLowerCase(),password=document.getElementById('authPassword').value,name=document.getElementById('authName').value.trim(),error=document.getElementById('authError'),submit=document.getElementById('authSubmit');error.textContent='';submit.disabled=true;submit.textContent='Conectando…';try{if(authMode==='reset'){if(password.length<6){error.textContent='La contraseña debe tener al menos 6 caracteres.';return}const {error:resetErr}=await supabaseClient.auth.updateUser({password});if(resetErr)throw resetErr;toast('Contraseña actualizada. Ya puedes iniciar sesión.');setAuthMode('login')}else if(authMode==='register'){if(name.length<2){error.textContent='Escribe tu nombre para personalizar tu experiencia.';return}const {data,error:err}=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:name}}});if(err)throw err;if(data.user&&data.session){const {error:profileErr}=await supabaseClient.from('profiles').upsert({id:data.user.id,display_name:name});if(profileErr)throw profileErr}if(data.session){showApp({name,email});toast('¡Cuenta creada! Bienvenido/a a RUBÍ 🎉')}else{error.textContent='Cuenta creada. Revisa tu correo para confirmar el registro y después inicia sesión.';setAuthMode('login')}}else{const {data,error:err}=await supabaseClient.auth.signInWithPassword({email,password});if(err)throw err;const user=data.user,displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'Atleta';await supabaseClient.from('profiles').upsert({id:user.id,display_name:displayName});showApp({name:displayName,email:user.email});toast('¡Hola, '+displayName.split(/\s+/)[0]+'! 👋')}}catch(err){error.textContent=err.message||'No se ha podido completar el acceso. Inténtalo de nuevo.'}finally{submit.disabled=false;submit.textContent=authMode==='register'?'Crear mi cuenta →':'Entrar a mi espacio →'}});
async function restoreSupabaseSession(){const {data:{session}}=await supabaseClient.auth.getSession();if(session){const user=session.user,displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'Atleta';showApp({name:displayName,email:user.email})}else{document.getElementById('authScreen').classList.add('show');setAuthMode('login')}}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){document.getElementById('authScreen').classList.add('show');setAuthMode('login')}if(event==='PASSWORD_RECOVERY'){authMode='reset';document.getElementById('authTitle').textContent='Nueva contraseña';document.getElementById('authSubtitle').textContent='Elige una contraseña segura para tu cuenta.';document.getElementById('loginTab').style.display='none';document.getElementById('registerTab').style.display='none';document.getElementById('nameLabel').style.display='none';document.getElementById('authEmail').required=false;document.getElementById('authEmail').parentElement.style.display='none';document.getElementById('recoveryBtn').style.display='none';document.getElementById('authPassword').placeholder='Nueva contraseña (mín. 6 caracteres)';document.getElementById('authSubmit').textContent='Actualizar contraseña';document.getElementById('authSwitch').style.display='none';document.getElementById('authScreen').classList.add('show')}});restoreSupabaseSession();
</script></body></html>
